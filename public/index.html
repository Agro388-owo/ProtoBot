<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProtoBot Profile</title>
    <style>
        body {
            background-color: #1e1f22;
            color: #dbdee1;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .discord-card {
            background-color: #111214;
            width: 340px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        .banner {
            height: 120px;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            position: relative;
            background-size: cover;
            background-position: center;
        }
        .profile-header {
            padding: 0 16px;
            position: relative;
            margin-bottom: 12px;
        }
        .avatar-container {
            position: absolute;
            top: -42px;
            left: 16px;
            background-color: #111214;
            padding: 4px;
            border-radius: 50%;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #2b2d31;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            border: 6px solid #111214;
            box-sizing: border-box;
            overflow: hidden;
        }
        .badges {
            display: flex;
            justify-content: flex-end;
            padding-top: 8px;
            gap: 6px;
        }
        .badge {
            background-color: #2b2d31;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #b5bac1;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-info {
            padding-top: 40px;
        }
        .username-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .username {
            font-size: 20px;
            font-weight: 700;
            color: #f2f3f5;
        }
        .bot-tag {
            background-color: #5865f2;
            color: white;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .handle {
            font-size: 13px;
            color: #949ba4;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #b5bac1;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .bio-box {
            background-color: #2b2d31;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            color: #dbdee1;
            margin: 16px;
        }
        .links {
            margin: 16px;
        }
        .links a {
            display: block;
            background-color: #4e5058;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .links a:hover {
            background-color: #6d6f78;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #23a55a;
            border-radius: 50%;
            margin-right: 6px;
        }
        .activity-text {
            font-size: 13px;
            color: #b5bac1;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="discord-card">
        <div class="banner"></div>

        <div class="profile-header">
            <div class="avatar-container">
                <div class="avatar">🤖</div>
            </div>
            <div class="badges">
                <div class="badge">⚡ Bot</div>
            </div>
        </div>

        <div style="padding: 0 16px;" class="user-info">
            <div class="username-row">
                <span class="username">ProtoBot</span>
                <span class="bot-tag">APP</span>
            </div>
            <div class="handle">ProtoBot</div>
            
            <div class="activity-text">
                <span class="status-indicator" id="status-dot"></span> 
                <span id="bot-status-text">Loading status...</span>
            </div>
        </div>

        <div class="bio-box">
            <div class="section-title">About Me</div>
            Just a silly ProtoBot created by Agro388. Doing its best to goof around. <br><br>
            ⏳ <span id="bot-uptime">Loading uptime...</span>
        </div>

        <div class="links">
            <a href="https://github.com/Agro388-Owo/ProtoBot" target="_blank">GitHub Source Code</a>
            <a href="https://linktr.ee/Agro388" target="_blank">Creator Linktree</a>
        </div>
    </div>

    <script>
        function updateUI(data) {
            document.getElementById('bot-status-text').innerText = `${data.activityTypeString} ${data.activityName}`;
            document.getElementById('bot-uptime').innerText = `Uptime: ${data.uptime}`;

            if (data.avatarUrl) {
                document.querySelector('.avatar').innerHTML = `<img src="${data.avatarUrl}" alt="Bot Avatar" style="width: 100%; height: 100%; border-radius: 50%;">`;
            }

            if (data.bannerUrl) {
                document.querySelector('.banner').style.backgroundImage = `url(${data.bannerUrl})`;
            }
        }

        // Initial fetch on page load
        fetch('/api/status')
            .then(res => res.json())
            .then(data => updateUI(data))
            .catch(() => {});

        // Listen for real-time pushed status changes instantly via SSE
        const eventSource = new EventSource('/api/events');
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            updateUI(data);
        };
    </script>
</body>
</html>
